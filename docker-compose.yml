# CipherRAG — Docker Infrastructure
# Project name is explicitly set so Docker doesn't depend on folder name
name: cipherrag

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Microsoft Presidio — Official PII/PHI Detection & Anonymization Engine
  # Docs: https://microsoft.github.io/presidio/
  # ─────────────────────────────────────────────────────────────────────────
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5001:3000"
    environment:
      - ANALYZER_PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5002:3000"
    environment:
      - ANONYMIZER_PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────
  # Seq — Structured Log Viewer (HIPAA audit trail UI)
  # ─────────────────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    env_file:
      - ./.env
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=${SEQ_FIRSTRUN_NOAUTHENTICATION:-false}
    ports:
      - "5341:5341"
      - "8081:80"
    restart: unless-stopped
    volumes:
      - seq-data:/data

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus + Grafana — Metrics & Monitoring
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    env_file:
      - ./.env
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  seq-data:
  grafana-data:
