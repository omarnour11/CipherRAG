name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CipherRAG.sln

      - name: Build
        run: dotnet build CipherRAG.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CipherRAG.sln --configuration Release --no-build --verbosity normal
